    enable_thinking: true
    preserve_thinking: true
    tool_channel: gemma4_native
    rationale: >-
      preserve_thinking defaults to false and the template's thinking_gate only
      renders reasoning for assistant messages after the last user message, so
      multi-turn agent trajectories would silently lose all intermediate-turn
      thinking. Tool calls render through the native <|tool_call> channel rather
      than hand-assembled terminus plain-text JSON.
    falsifier: >-
      If the M1 parser hard-error rate rises by >=5pp against the frozen B0 value
      of 17.823%, revisit tool_channel.

